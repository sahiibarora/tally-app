name: Keep Tally awake

# Supabase's free tier pauses the database after ~7 days without activity, and
# Render's free tier sleeps the server when idle. Calling /api/health/ (which
# runs a real database query) every 2 days keeps the database from pausing.
on:
  schedule:
    - cron: "0 6 */2 * *"   # every 2 days at 06:00 UTC
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app (retries while Render wakes up)
        run: |
          curl --fail --silent --show-error \
            --max-time 120 \
            --retry 6 --retry-delay 20 --retry-all-errors \
            https://tally-app-knot.onrender.com/api/health/
